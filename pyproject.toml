[project]
name = "agentcore-studio-app"
version = "0.1.0"
description = "AgentCore Studio — composition root (ensure_all_schemas, grant_app_privileges, FastAPI wiring). Owner: mentor."
requires-python = ">=3.14"
dependencies = [
    "agentcore-studio-contracts",
    "agentcore-studio-kb",
    "agentcore-studio-engine",
    "agentcore-studio-workbench",
    "agentcore-studio-evalhub",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary,pool]>=3.2",
    "orjson>=3.10",
    "loguru>=0.7",
    "httpx>=0.28",
]

# Declared now (F7) so P9's observability wiring and Gemini LLM-provider wiring never need
# to add a new dependency or relock uv.lock outside P1/P9.
[project.optional-dependencies]
obs = [
    "langfuse>=4,<5",
]
gemini = [
    "google-genai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_app"]
